name: TypeScript

# Corre cuando cambia el workspace TypeScript (ts/) y también cuando cambia lo que la API lee de Laravel:
# las migraciones (esquema) y el seeder de roles/permisos. Un cambio de esquema en PHP que rompa la API
# TypeScript tiene que saltar aquí, no en producción.
on:
  push:
    branches: [master]
    paths:
      - 'ts/**'
      - 'database/migrations/**'
      - 'database/seeders/RolesSeeder.php'
      - '.github/workflows/ts.yml'
  pull_request:
    branches: [master]
    paths:
      - 'ts/**'
      - 'database/migrations/**'
      - 'database/seeders/RolesSeeder.php'
      - '.github/workflows/ts.yml'

concurrency:
  group: ts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    name: Typecheck + unitarias + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ts

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck (shared + api + web)
        run: npm run typecheck

      - name: Pruebas unitarias de la API (no necesitan base de datos)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E contra MySQL con el esquema de Laravel
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sge_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # Redis real para las pruebas de invalidación de la caché de Laravel y de /health (usan la base 15).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    # Para migrar y sembrar con artisan sin necesitar Redis.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sge_e2e
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v7

      # ── 1) Base real: el esquema se crea con las migraciones de Laravel, no a mano ──────────────
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip, gd, bcmath, intl, exif, curl, dom, fileinfo
          coverage: none

      - name: Cache de dependencias de Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrar y sembrar roles/permisos (como en producción)
        run: |
          php artisan migrate --force
          php artisan db:seed --class=RolesSeeder --force

      # Reverb efímero con credenciales INVENTADAS (solo viven en este job) para la prueba de tiempo real de la API TypeScript.
      - name: Arrancar Reverb de pruebas
        env:
          REVERB_APP_ID: ci-app
          REVERB_APP_KEY: ci-key
          REVERB_APP_SECRET: ci-secret
        run: |
          nohup php artisan reverb:start --host=127.0.0.1 --port=8080 > reverb.log 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null && exit 0; sleep 1; done
          echo "Reverb no arrancó:"; cat reverb.log; exit 1

      # ── 2) API TypeScript sobre esa base ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Instalar dependencias de TypeScript
        working-directory: ts
        run: npm ci --no-audit --no-fund

      - name: Compilar el paquete compartido
        working-directory: ts
        run: npm run build:shared

      - name: Los tipos de la base (db.d.ts) siguen al día con las migraciones
        working-directory: ts
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/sge_e2e
        run: npm run db:types:check -w @zuraedu/api

      - name: Pruebas e2e (autenticación, permisos, aislamiento entre colegios, caché)
        working-directory: ts
        env:
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/sge_e2e
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REVERB_APP_ID: ci-app
          TEST_REVERB_APP_KEY: ci-key
          TEST_REVERB_APP_SECRET: ci-secret
        run: npm run test:e2e -w @zuraedu/api

      # ── 3) Web: prueba de humo del flujo completo (Laravel para el login + API TypeScript + web, contra MySQL real) ──────────
      - name: Preparar datos de la prueba de humo de la web
        working-directory: ts
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/sge_e2e
        run: |
          HASH=$(php -r 'echo password_hash("SmokeWeb-2026", PASSWORD_BCRYPT);')
          SMOKE_PASSWORD_HASH="$HASH" node apps/web/test/preparar-smoke.mjs >> "$GITHUB_ENV"

      - name: Compilar la API y la web
        working-directory: ts
        run: |
          npm run build -w @zuraedu/api
          npm run build -w @zuraedu/web

      - name: Prueba de humo de la web (login, listado, edición, CSRF, aislamiento, cierre de sesión)
        working-directory: ts
        env:
          SMOKE_PASSWORD: SmokeWeb-2026
        run: |
          LOGS="$GITHUB_WORKSPACE/logs-humo"; mkdir -p "$LOGS"
          # Laravel emite y revoca los tokens (login). Sin config:cache, con la base y la caché del job.
          (cd "$GITHUB_WORKSPACE/public" && nohup php -S 127.0.0.1:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > "$LOGS/laravel.log" 2>&1 &)
          # API: sin límite de peticiones ni caché de autenticación para que el cierre de sesión se note al instante.
          (cd apps/api && RATE_LIMIT_PER_MINUTE=0 AUTH_CACHE_TTL_SECONDS=0 NODE_ENV=production DATABASE_URL=mysql://root:root@127.0.0.1:3306/sge_e2e API_PORT=3100 nohup node dist/main.js > "$LOGS/api.log" 2>&1 &)
          (cd apps/web && API_URL=http://127.0.0.1:3100 LARAVEL_URL=http://127.0.0.1:8000 COOKIE_SECURE=false NODE_ENV=production nohup npx next start -p 3101 > "$LOGS/web.log" 2>&1 &)
          for i in $(seq 1 60); do
            a=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $SMOKE_HOST" http://127.0.0.1:3101/login)
            b=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/health)
            [ "$a" = 200 ] && [ "$b" = 200 ] && break
            sleep 1
          done
          WEB_URL=http://127.0.0.1:3101 API_URL=http://127.0.0.1:3100 node apps/web/test/smoke.mjs

      - name: Registros de los servicios (solo si algo falló)
        if: failure()
        run: |
          for f in "$GITHUB_WORKSPACE"/logs-humo/*.log; do echo "===== $f"; tail -n 60 "$f" 2>/dev/null || true; done
