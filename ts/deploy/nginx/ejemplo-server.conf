# ── Ejemplo COMPLETO de `server { }` de producción: TLS, redirección a HTTPS, PHP por FastCGI (PHP-FPM) y el enrutamiento strangler ──
# Ajusta los valores marcados con «AJUSTAR». Va dentro de `http { }` junto a `zuraedu-strangler-http.conf` (que debe incluirse ANTES).
# Probado con Nginx 1.22 contra Laravel (php-cgi por FastCGI), la API TypeScript y la web (ver README.md).

# HTTP → HTTPS (el token de sesión viaja en una cookie `Secure`: sin TLS no funciona).
server {
    listen 80;
    server_name ejemplo.com *.ejemplo.com;            # AJUSTAR: tu dominio y sus subdominios (un subdominio por colegio)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ejemplo.com *.ejemplo.com;            # AJUSTAR

    ssl_certificate     /etc/ssl/ejemplo.com/fullchain.pem;   # AJUSTAR (certificado comodín si usas subdominios por colegio)
    ssl_certificate_key /etc/ssl/ejemplo.com/privkey.pem;     # AJUSTAR
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/zuraedu/public;                     # AJUSTAR: carpeta `public` de Laravel
    index index.php;
    client_max_body_size 20m;

    # El navegador no vuelve a abrir el sitio por http durante un año.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── Strangler: lo migrado a TypeScript y la web nueva, ANTES del `location /` de PHP ──────────────────────────────────
    include /etc/nginx/zuraedu/zuraedu-strangler-locations.conf;   # AJUSTAR la ruta donde copies el archivo

    # ── Laravel (todo lo demás) ──────────────────────────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;    # AJUSTAR (o 127.0.0.1:9000)
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;                        # el TLS termina aquí: Laravel debe saberlo
        fastcgi_read_timeout 60s;
    }

    # Nada de archivos ocultos (.env, .git…), salvo /.well-known (validación de certificados).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
