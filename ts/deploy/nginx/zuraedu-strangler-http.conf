# ── Incluir DENTRO del bloque `http { ... }` de Nginx (p. ej. /etc/nginx/conf.d/zuraedu-strangler-http.conf) ──────────
# Parte 1 de 2. La parte 2 (zuraedu-strangler-locations.conf) va dentro del `server { ... }` de la app.

# API TypeScript (apps/api). Debe escuchar SOLO en loopback o en una red privada: Nginx es el único que la alcanza, así que
# el límite por IP de abajo no se puede esquivar yendo directo al puerto de Node.
upstream zuraedu_ts_api {
    server 127.0.0.1:3100;
    keepalive 32;
}

# Web nueva (apps/web, Next.js). Escucha solo en loopback, igual que la API.
upstream zuraedu_web {
    server 127.0.0.1:3101;
    keepalive 16;
}

# Límite por IP para TODO lo que entra a la API TypeScript, incluidas las peticiones SIN token válido (que la aplicación no
# limita: ver ts/apps/api/src/ratelimit/rate-limit.guard.ts). La aplicación ya limita por USUARIO autenticado (60/min);
# este es un tope mucho más holgado por IP (un colegio entero puede salir por la misma IP pública de NAT) cuyo objetivo es
# frenar abuso y fuerza bruta, no el uso normal.
#   rate=300r/m  -> 5 peticiones/segundo sostenidas por IP
#   burst=100    -> picos de hasta 100 peticiones seguidas sin rechazo
limit_req_zone $binary_remote_addr zone=zuraedu_ts_api_ip:10m rate=300r/m;
limit_req_status 429;

# Web nueva: más holgado que la API porque una página trae decenas de archivos estáticos (/_next/static/…) con una sola visita.
limit_req_zone $binary_remote_addr zone=zuraedu_web_ip:10m rate=600r/m;
# Inicio de sesión: tope estricto por IP (Laravel además limita a 10 intentos por minuto por IP y por usuario). Frena la fuerza bruta
# antes de que llegue a Node o a PHP.
limit_req_zone $binary_remote_addr zone=zuraedu_login_ip:10m rate=20r/m;

