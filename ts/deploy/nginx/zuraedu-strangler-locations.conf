# ── Incluir DENTRO del `server { ... }` de la app, ANTES del `location /` que envía todo a PHP-FPM ─────────────────────
# Parte 2 de 2 (la parte 1 es zuraedu-strangler-http.conf, que va en `http { ... }`).
#
# Patrón "strangler": lo que ya migró a TypeScript se enruta por RUTA EXACTA; todo lo demás sigue en Laravel sin cambios.
#
# OJO: NO enviar todo `/api/v1/` a Node. Laravel usa ese mismo prefijo para la API móvil (`/api/v1/auth/login`,
# `/api/v1/dashboard`, ...). Solo `estudiantes` está en TypeScript; cada módulo nuevo se añade aquí por nombre, y para
# revertir uno basta con quitarlo de la lista (vuelve a Laravel de inmediato: la BD y las reglas son las mismas).

# Estudiantes (GET listado, POST alta, PATCH/DELETE /:id).
location ~ ^/api/v1/estudiantes(/[0-9]+)?/?$ {
    limit_req zone=zuraedu_ts_api_ip burst=100 nodelay;

    proxy_pass         http://zuraedu_ts_api;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";            # necesario para keepalive hacia el upstream

    # IMPRESCINDIBLE: la API decide el colegio por el Host (y rechaza con 403 un token usado en el dominio de otro colegio).
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_read_timeout    30s;
}

# Contrato OpenAPI (público, no contiene datos de colegios). Laravel no tiene esta ruta.
location = /openapi.json {
    limit_req zone=zuraedu_ts_api_ip burst=20 nodelay;
    proxy_pass         http://zuraedu_ts_api;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
}

# Estado de la API TypeScript para el monitoreo. `/health` (sin prefijo) sigue siendo el de Laravel.
location = /ts-health {
    allow 127.0.0.1;
    deny  all;                                    # solo monitoreo local; cámbialo por la IP de tu monitor
    proxy_pass         http://zuraedu_ts_api/health;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
}

# ── Web nueva (Next.js) bajo /nuevo ─────────────────────────────────────────────────────────────────────────────────
# Laravel ya usa /login y / en el mismo servidor, así que la web vive bajo un prefijo. DEBE coincidir con WEB_BASE_PATH con el que se
# compiló (`WEB_BASE_PATH=/nuevo npm run build -w @zuraedu/web`). Con ese prefijo la cookie del token (Path=/nuevo) tampoco viaja a Laravel.
# La raíz de la web (/nuevo, sin barra final) la sirve Next, que la manda a /nuevo/login. NO añadas aquí una redirección a /nuevo/: Next
# normaliza /nuevo/ → /nuevo (308) y las dos se empujarían mutuamente en un bucle infinito (se comprobó).
location = /nuevo {
    proxy_pass         http://zuraedu_web;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Inicio de sesión: tope estricto por IP. Va ANTES del prefijo general (el más largo gana).
location = /nuevo/sesion/entrar {
    limit_req zone=zuraedu_login_ip burst=10 nodelay;
    proxy_pass         http://zuraedu_web;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# `^~` evita que una expresión regular posterior (p. ej. `location ~ \.php$`) capture algo bajo /nuevo/.
location ^~ /nuevo/ {
    limit_req zone=zuraedu_web_ip burst=200 nodelay;

    proxy_pass         http://zuraedu_web;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    # El Host se conserva: la web lo reenvía a la API, que decide el colegio por él.
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    # SOBRESCRIBE la cabecera con la IP real (`$remote_addr`) en vez de añadirla (`$proxy_add_x_forwarded_for`): con "añadir", el cliente manda
    # `X-Forwarded-For: <IP falsa>` y llega `falsa, real`; si algo toma la primera, esquiva el límite de login por IP y falsifica la auditoría.
    # (Si hay un balanceador o CDN delante de Nginx, usa el módulo `realip` para que `$remote_addr` sea la IP real del usuario.)
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_read_timeout    30s;
}

